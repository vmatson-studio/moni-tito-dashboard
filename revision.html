<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión compartida · Moni & Tito</title>
<style>
:root{--bg:#f0f4ef;--panel:#fff;--ink:#3f4a42;--muted:#69746b;--line:#d5ddd3;--sage:#74816f;--soft:#eef3ec;--warn:#a87b2c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100vh}.preview{min-width:0}.preview iframe{width:100%;height:100vh;border:0;background:#fff}.side{height:100vh;overflow:auto;border-left:1px solid var(--line);background:#fbfcf9;padding:18px;position:sticky;top:0}.brand{font-family:Georgia,serif;font-size:24px;margin-bottom:3px}.sub{font-size:12px;color:var(--muted);margin-bottom:16px}.status{padding:10px 12px;border-radius:10px;background:var(--soft);font-size:12px;line-height:1.45;margin-bottom:14px}.status.ok{color:#2b6947}.status.warn{color:var(--warn)}.areas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.areas button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.areas button.active{background:var(--sage);color:#fff;border-color:var(--sage)}label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:12px 0 7px}textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;background:#fff;color:var(--ink)}.row{display:flex;gap:8px;margin-top:9px}.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;background:var(--sage);color:#fff}.btn.alt{background:#ecefe8;color:var(--ink)}.history{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.note b{font-size:12px}.note small{display:block;color:var(--muted);margin-top:3px}.note p{font-size:12px;line-height:1.45;white-space:pre-wrap;margin:7px 0 0}.login{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}@media(max-width:900px){.shell{display:block}.preview iframe{height:58vh}.side{height:auto;position:static;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="shell">
  <main class="preview"><iframe id="panel" src="./index.html" title="Panel Moni y Tito"></iframe></main>
  <aside class="side">
    <div class="brand">Revisión compartida</div>
    <div class="sub">Tito anota cambios · Vanne los ve online</div>
    <div class="login"><button class="btn" id="login">Entrar con Google</button><button class="btn alt" id="logout" style="display:none">Salir</button></div>
    <div class="status warn" id="state">Inicia sesión con Google para guardar y ver las notas compartidas.</div>
    <label>Área que estás revisando</label>
    <div class="areas" id="areas"></div>
    <label id="noteLabel">Nota para: Resumen</label>
    <textarea id="note" placeholder="Ejemplo: cambiar este texto, mover esta tarjeta, añadir una opción…"></textarea>
    <div class="row"><button class="btn" id="save">Guardar cambio</button><button class="btn alt" id="clear">Limpiar</button></div>
    <div class="history"><b>Cambios solicitados</b><div id="history"><p style="font-size:12px;color:var(--muted)">Inicia sesión para ver el historial.</p></div></div>
  </aside>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBsNVV4k-qWSPDWVseFonrhHekBJoALRvY',authDomain:'gen-lang-client-0727156619.firebaseapp.com',projectId:'gen-lang-client-0727156619',storageBucket:'gen-lang-client-0727156619.firebasestorage.app',messagingSenderId:'589633331931',appId:'1:589633331931:web:3b4d820bc977ded0fb62fe',measurementId:'G-Z0F5DM7MDQ'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const AREAS=[['dashboard','Resumen'],['invitation','Mi invitación'],['edit','Contenido'],['guests','Invitados'],['rsvps','Respuestas'],['operations','Organización'],['guide','Guía'],['settings','Ajustes']];
let user=null,current='dashboard',unsubscribe=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setArea(id,send=true){if(!AREAS.some(a=>a[0]===id))return;current=id;$('noteLabel').textContent='Nota para: '+AREAS.find(a=>a[0]===id)[1];document.querySelectorAll('#areas button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(send){try{$('panel').contentWindow.switchView(id)}catch(e){}}}
AREAS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>setArea(id);$('areas').appendChild(b)});setArea('dashboard',false);
$('panel').addEventListener('load',()=>{try{const w=$('panel').contentWindow;if(typeof w.switchView==='function'){const orig=w.switchView.bind(w);w.switchView=function(name){orig(name);setArea(name,false)}}}catch(e){}});
$('login').onclick=()=>signInWithPopup(auth,provider).catch(e=>alert('No se pudo iniciar sesión: '+e.message));$('logout').onclick=()=>signOut(auth);$('clear').onclick=()=>$('note').value='';
$('save').onclick=async()=>{if(!user){alert('Primero entra con Google.');return}const text=$('note').value.trim();if(!text){alert('Escribe el cambio que quieres pedir.');return}try{await addDoc(collection(db,'review_note_history'),{area:current,areaLabel:AREAS.find(a=>a[0]===current)[1],text,authorUid:user.uid,authorName:user.displayName||'',authorEmail:user.email||'',status:'pendiente',createdAt:serverTimestamp()});$('note').value='';$('state').className='status ok';$('state').textContent='✓ Cambio guardado online. Vanne podrá verlo desde su ordenador.'}catch(e){$('state').className='status warn';$('state').textContent='Firebase no permitió guardar ('+(e.code||'error')+'). Hay que ajustar las reglas de Firestore.'}};
function watch(){if(unsubscribe)unsubscribe();const q=query(collection(db,'review_note_history'),orderBy('createdAt','desc'));unsubscribe=onSnapshot(q,s=>{$('history').innerHTML=s.empty?'<p style="font-size:12px;color:var(--muted)">Todavía no hay cambios guardados.</p>':s.docs.slice(0,30).map(x=>{const d=x.data();return `<div class="note"><b>${esc(d.areaLabel||d.area||'Área')}</b><small>${esc(d.authorName||d.authorEmail||'Usuario')} · ${esc(d.status||'pendiente')}</small><p>${esc(d.text||'')}</p></div>`}).join('')},e=>{$('history').innerHTML='<p style="font-size:12px;color:var(--muted)">No se pudo cargar el historial: '+esc(e.code||'error')+'</p>'})}
onAuthStateChanged(auth,u=>{user=u;$('login').style.display=u?'none':'';$('logout').style.display=u?'':'none';if(u){$('state').className='status ok';$('state').textContent='Conectado: '+(u.displayName||u.email);watch()}else{$('state').className='status warn';$('state').textContent='Inicia sesión con Google para guardar y ver las notas compartidas.';$('history').innerHTML='<p style="font-size:12px;color:var(--muted)">Inicia sesión para ver el historial.</p>';if(unsubscribe){unsubscribe();unsubscribe=null}}});
</script>
</body>
</html>
